# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.tmux/plugins'

set -g base-index 1
setw -g pane-base-index 1

set-option -g prefix C-b
set-option -g prefix2 None

# -- YAZI CONFIG
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
unbind %
bind | split-window -h -c "#{pane_current_path}" 

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

# reload config using <prefix> r
unbind r 
bind r source-file ~/.config/tmux/tmux.conf


# ---------- Pop-up Windows ---------------------------------------------
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit
bind -r d display-popup -d '#{pane_current_path}' -w80% -h80% -E lazydocker
bind -r y display-popup -d '#{pane_current_path}' -w80% -h80% -E yazi
bind -r e display-popup -d '#{pane_current_path}' -w80% -h80% -E nvim
bind -r S display-popup -d '#{pane_current_path}' -w80% -h80% -E spf
# bind -r m display-popup -d '#{pane_current_path}' -w80% -h80% run-shell "tv man"
# -------------------- Lazy Apps ----------------------------------------
bind -r D run-shell -d "open #{pane_current_path}" "lazydocker"
bind -r G run-shell -d "open #{pane_current_path}" "TERM=xterm-256color /bin/bash -c lazygit"
bind -r Y run-shell "TERM=xterm-256color /bin/bash -c yazi"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z
bind-key C-Tab next-window
bind-key C-S-Tab previous-window
set -g mouse on

# for vim shell navigations and selects in tmux panes
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Instant switch to a new tmux session directory that exist
bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer"

bind-key n command-prompt "new-session -s '%%'"

unbind -T copy-mode-vi MouseDragEnd1Pane

# tpm tmux plugin manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
# set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'catppuccin/tmux'
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> o" to activate
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
# set -g @plugin 'erikw/tmux-powerline'
# set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'AngryMorrocoy/tmux-neolazygit'
set-option -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'tmux-plugins/tmux-open'
# set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @treemux-tree-nvim-init-file '~/.tmux/plugins/treemux/configs/treemux_init.lua'
set -g @plugin 'kiyoon/treemux'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'whame/tmux-modal'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin '27medkamal/tmux-session-wizard'
set -ga update-environment nvim
set -g @plugin 'artemave/tmux_super_fingers'
set -g @plugin 'tmux-plugins/tmux-sessionist'

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'dreknix/tmux-primary-ip'
set -g @plugin 'jabirali/tmux-tilish'

# Rebind tmuxsessionx keys to o
set -g @sessionx-bind 'o'


# Rebind Lazygit key to G
set -g @open-lazygit 'G'


set -g @tilish-default 'main-vertical'


# ------------ CATPPUCCIN THEME ------------
#
#
#

### https://github.com/catppuccin/tmux
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'yes'
set -g @catppuccin_window_default_text '#W'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_date_time_text '%d.%m. %H:%M'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'

# source the plugin here
run '#{TMUX_PLUGIN_MANAGER_PATH}/catppuccin/tmux/catppuccin.tmux'

# load custom moudules
source -F '#{d:current_file}/custom_modules/ctp_cpu.conf'
source -F '#{d:current_file}/custom_modules/ctp_memory.conf'
source -F '#{d:current_file}/custom_modules/primary_ip.conf'

# set left and right status bar
set -g allow-rename off
set -g status-position top
set -g status-bg 'default'
set -g status-style 'default'
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session} '
set -gF status-right '#{E:@catppuccin_status_primary_ip}'
set -agF status-right '#{E:@catppuccin_status_ctp_cpu}'
set -agF status-right '#{E:@catppuccin_status_ctp_memory}'
if 'test -r /sys/class/power_supply/BAT*' {
  set -agF status-right '#{E:@catppuccin_status_battery}'
}
set -ag status-right '#{E:@catppuccin_status_date_time}'


# ~/.tmux.conf



# Or, if using TPM, just run TPM




set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"

# initialize tmux plugin manager (keep this line at the bottom of the file)
run '~/.config/tmux/plugins/tpm/tpm'
